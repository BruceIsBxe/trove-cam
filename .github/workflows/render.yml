name: render
run-name: render ${{ inputs.job_id }}

# #reports clip videos rendered by the game's own clip renderer (cliprender render_clip.py) instead of a camera client
# (film.yml). Bryce, 2026-11-28: report clips should come from our renderer, not Cinnabar.
# The Da Club bot dispatches this for a new #reports clip with an age-encrypted payload
# {"v":1,"kind":"render","base","token","inputs":{"kit","world","clip"}} (to .github/cam-runner-recipient.txt).
# The runner fetches, with the one-time token and each age-encrypted to this runner: the clip kit (cliprender + the pack
# files it reads; cached here only as ciphertext), the bot's read-only world copy and the clip input (clip file, the
# players' skins and render.json with the view choice). Mojang's Bedrock textures (Mojang/bedrock-samples) and Java
# sounds + font (Mojang's launcher servers) are fetched at run time and never cached or uploaded in clear
# (scripts/run_export.py). OpenGL is Mesa's software renderer (llvmpipe) through EGL, or Xvfb + GLX when EGL has no
# device. The MP4 (<= 9 MiB, two-pass) is encrypted to the bot (and the owner's analysis key) and uploaded for 1 day;
# the bot downloads it, adds it to the #reports post and deletes the run.
# PRIVACY: public repository. The clip id never reaches this runner; player names exist only inside the encrypted inputs
# and outputs; the renderer's own output goes to the encrypted log; this log says only stages, sizes and seconds.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: bot job id (j + 12 hex)
        required: true
      payload:
        description: base64 age ciphertext (see header)
        required: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check inputs
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          [[ "$JOB_ID" =~ ^j[0-9a-f]{12}$ ]] || { echo "bad job id"; exit 1; }

      - uses: actions/checkout@v4

      # pinned like map / bundle: the runner image's default python3 (3.14) has no Pillow 11.0 wheel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools
        run: |
          sudo apt-get update -q > /dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends age ffmpeg \
            libegl1 libgl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 xvfb xauth > /dev/null
          python3 -m pip install -q --disable-pip-version-check numpy==2.1.3 pillow==11.0.0 imageio-ffmpeg==0.5.1 moderngl==5.13.0 glcontext==3.1.0
          echo "tools ok"

      - name: OpenGL
        run: |
          if python3 scripts/run_render.py probe; then echo "gl: egl"; else echo "gl: no egl device, Xvfb + GLX"; fi

      - name: Open payload
        env:
          PAYLOAD: ${{ inputs.payload }}
          CAM_RUNNER_AGE_IDENTITY: ${{ secrets.CAM_RUNNER_AGE_IDENTITY }}
        run: python3 scripts/runner_job.py open render

      # The cache holds only the kit's age ciphertext (to this runner's key), keyed by the kit's plaintext sha256.
      - name: Kit cache
        uses: actions/cache@v4
        with:
          path: ~/kit-cache/clip-kit.age
          key: clip-kit-${{ env.KIT_SHA }}

      - name: Fetch inputs
        env:
          CAM_RUNNER_AGE_IDENTITY: ${{ secrets.CAM_RUNNER_AGE_IDENTITY }}
        run: |
          mkdir -p work/kit work/world work/clip out/log
          python3 scripts/runner_job.py fetch kit work/kit.tar.gz --cache ~/kit-cache/clip-kit.age
          python3 scripts/runner_job.py fetch world work/world.tar.gz
          python3 scripts/runner_job.py fetch clip work/clip.tar.gz
          tar -xzf work/kit.tar.gz -C work/kit --no-same-owner
          tar -xzf work/world.tar.gz -C work/world --no-same-owner
          tar -xzf work/clip.tar.gz -C work/clip --no-same-owner
          rm -f work/*.tar.gz
          [ -d work/world/db ] && [ -f work/clip/clip.json.gz ] || { echo "inputs incomplete"; exit 1; }
          [ -f work/kit/tools/cliprender/render_clip.py ] || { echo "the clip kit has no render_clip.py (rebuild it)" | tee out/log/failure.txt; exit 1; }
          echo "inputs ok"

      - name: Render
        env:
          MINECRAFT_DIR: ${{ runner.temp }}/mojang
        run: |
          T0=$(date +%s)
          mkdir -p out/result
          RUN=()
          [ "${CLIPRENDER_GL_BACKEND:-}" = egl ] || RUN=(xvfb-run -a -s "-screen 0 1280x720x24")
          if "${RUN[@]}" python3 scripts/run_render.py work/kit --clip work/clip/clip.json.gz --skins work/clip/skins \
              --world-db work/world/db --cache work/cache --out out/result --tmp work/tmp --opts work/clip/render.json \
              > out/log/render.log 2>&1 && [ -s out/result/clip.mp4 ] && [ -f out/result/meta.json ]; then
            cp work/tmp/render.coverage.json out/log/ 2>/dev/null || true
            python3 -c "import json,sys; m=json.load(open('out/result/meta.json')); print('render ok:', ', '.join(f'{k} {m[k]}' for k in ('bytes','seconds','width','height','view','passes','render_s','encode_s','gl') if k in m))"
            echo "total $(( $(date +%s) - T0 )) s"
          else
            echo "render failed" | tee out/log/failure.txt
            tail -n 3 out/log/render.log >> out/log/failure.txt
            exit 1
          fi

      - name: Encrypt and remove plaintext
        if: always()
        run: |
          mkdir -p out/log enc
          R1=$(cat .github/bot-recipient.txt); R2=$(cat .github/clip-recipient.txt)
          if [ -s out/result/clip.mp4 ]; then tar -C out/result -czf - . | age -r "$R1" -r "$R2" -o enc/result.tar.gz.age; fi
          tar -C out/log -czf - . | age -r "$R1" -r "$R2" -o enc/log.tar.gz.age
          rm -rf out work "$RUNNER_TEMP/trove-job.json" "$RUNNER_TEMP/mojang"
          ls -l enc | awk 'NR>1{print $5, $9}'

      - name: Upload encrypted video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ inputs.job_id }}
          path: enc/result.tar.gz.age
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Upload encrypted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ inputs.job_id }}
          path: enc/log.tar.gz.age
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
