name: cam-test

# Can a GitHub runner (no GPU) render a Bedrock client (Cinnabar) in software, join a server and record a clip?
# target=local: a throwaway PocketMine-MP (NG) on 127.0.0.1 with a test scene (the default; no real server involved).
# target=remote: the server in the SERVER_ADDR secret (phase 2, not exercised yet).
#
# PRIVACY (this repository may be public): the clip and all detailed logs are encrypted with age to the recipient
# in .github/clip-recipient.txt before upload; only the holder of the matching identity can read them. The public
# Actions log shows stage names and numbers only. Secret values are masked.

on:
  workflow_dispatch:
    inputs:
      target:
        description: local (throwaway test server), film-local (production film.sh against the local test server) or remote (SERVER_ADDR secret)
        default: local
      record_seconds:
        description: Seconds of clip
        default: "20"
      width:
        default: "854"
      height:
        default: "480"
      capture_fps:
        default: "30"
      speed:
        description: Local scene speed (1 = real time; 0.25 = slow motion, sped back up in the clip)
        default: "1"
      backend:
        description: wgpu backend (vulkan = lavapipe, gl = llvmpipe)
        default: vulkan
      cinnabar_tag:
        description: Cinnabar release tag (cinnabar-mc/cinnabar)
        default: v0.2.1

permissions:
  contents: read

env:
  PHAR_TAG: pm-ng-eaa2e581
  PHP_URL: https://github.com/axolotl-pm/PHP-Binaries/releases/download/pm5-php-8.4-latest/PHP-8.4-Linux-x86_64-PM5.tar.gz

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Mask private values
        env:
          SERVER_ADDR: ${{ secrets.SERVER_ADDR }}
          CAMERA_NAME: ${{ secrets.CAMERA_NAME }}
        run: |
          for v in "$SERVER_ADDR" "${SERVER_ADDR%:*}" "$CAMERA_NAME"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: System packages (Xvfb, Mesa lavapipe/llvmpipe, ffmpeg, age)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            xvfb xdotool x11-utils mesa-utils mesa-vulkan-drivers libvulkan1 vulkan-tools \
            libgl1-mesa-dri libegl1 libegl-mesa0 libgles2 libgbm1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libx11-xcb1 libxcb-shape0 libxcb-xfixes0 \
            libasound2t64 libudev1 libwayland-client0 libwayland-cursor0 libwayland-egl1 libfontconfig1 \
            ffmpeg sysstat age
          age --version

      - name: Cache Cinnabar app
        id: cache-app
        uses: actions/cache@v4
        with:
          path: ~/tools/cinnabar
          key: cinnabar-app-${{ inputs.cinnabar_tag }}

      - name: Download Cinnabar
        if: steps.cache-app.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tools/cinnabar && cd ~/tools/cinnabar
          base=https://github.com/cinnabar-mc/cinnabar/releases/download/${{ inputs.cinnabar_tag }}
          curl -fsSL -o Cinnabar-x86_64.AppImage "$base/Cinnabar-x86_64.AppImage"
          curl -fsSL -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          grep ' Cinnabar-x86_64.AppImage$' SHA256SUMS.txt | sha256sum -c -
          chmod +x Cinnabar-x86_64.AppImage
          ./Cinnabar-x86_64.AppImage --appimage-extract > /dev/null
          rm Cinnabar-x86_64.AppImage

      - name: Cache Cinnabar prepared assets (Mojang pack, converted on first run)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cinnabar
          key: cinnabar-data-${{ inputs.cinnabar_tag }}-v1

      - name: Cache shader caches (Mesa llvmpipe/lavapipe)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mesa_shader_cache
            ~/.cache/mesa_shader_cache_db
          key: shaders-${{ inputs.cinnabar_tag }}-${{ inputs.backend }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: shaders-${{ inputs.cinnabar_tag }}-${{ inputs.backend }}-${{ runner.arch }}-

      - name: Local test server (unmodified NetherGames PocketMine-MP phar, Axolotl PHP 8.4)
        if: inputs.target != 'remote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PM_DIR="$RUNNER_TEMP/pm"; mkdir -p "$PM_DIR"
          cp -r server/. "$PM_DIR/"
          gh release download "$PHAR_TAG" -R "$GITHUB_REPOSITORY" -p PocketMine-MP.phar -D "$PM_DIR"
          sha256sum "$PM_DIR/PocketMine-MP.phar"
          curl -fsSL "$PHP_URL" | tar -xz -C "$PM_DIR"
          # the Axolotl php.ini has no extension_dir; point it at the bundled one (as PocketMine's installer does)
          EXT_DIR=$(find "$PM_DIR/bin" -type d -name "*debug-zts*" | head -1)
          INI="$PM_DIR/bin/php7/bin/php.ini"
          if [ -n "$EXT_DIR" ] && [ -f "$INI" ]; then
            sed -i '/^extension_dir=/d' "$INI"
            echo "extension_dir=\"$EXT_DIR\"" >> "$INI"
          fi
          "$PM_DIR/bin/php7/bin/php" -v | head -1
          echo "PM_DIR=$PM_DIR" >> "$GITHUB_ENV"

      - name: Test bot (bedrock-protocol)
        if: inputs.target == 'local'
        continue-on-error: true
        working-directory: bot
        run: npm install --no-audit --no-fund --silent

      - name: Run camera
        env:
          TARGET: ${{ inputs.target }}
          SERVER_ADDR: ${{ secrets.SERVER_ADDR }}
          CAMERA_NAME: ${{ secrets.CAMERA_NAME }}
          RECORD_SECONDS: ${{ inputs.record_seconds }}
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
          BACKEND: ${{ inputs.backend }}
          CAPTURE_FPS: ${{ inputs.capture_fps }}
          SPEED: ${{ inputs.speed }}
          CINNABAR: /home/runner/tools/cinnabar/squashfs-root/AppRun
          OUT: ${{ github.workspace }}/out
        run: |
          if [ "$TARGET" = film-local ]; then bash scripts/film_local_test.sh; else bash scripts/run.sh; fi

      - name: Encrypt outputs (age) and remove plaintext
        if: always()
        run: |
          mkdir -p out enc
          echo "job_seconds_before_upload=$(( $(date +%s) - JOB_T0 ))" | tee out/job-time.txt
          RECIPIENT=$(cat .github/clip-recipient.txt)
          BOT=$(cat .github/bot-recipient.txt)
          if [ -f out/clip.mp4 ]; then age -r "$RECIPIENT" -r "$BOT" -o enc/clip.mp4.age out/clip.mp4; fi
          tar -C out --exclude=./clip.mp4 --exclude=./raw.mp4 --exclude=./raw.mkv -czf - . | age -r "$RECIPIENT" -o enc/logs.tar.gz.age
          rm -rf out
          rm -rf ~/.local/share/cinnabar/logs ~/.local/share/cinnabar/run ~/.local/share/cinnabar/crashes
          ls -l enc

      - name: Upload encrypted clip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip
          path: enc/clip.mp4.age
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload encrypted logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: enc/logs.tar.gz.age
          if-no-files-found: ignore
          retention-days: 7
