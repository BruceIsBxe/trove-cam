# Minimal config for the throwaway trove-cam test server; every other key uses PocketMine's defaults.
settings:
  # the NG fork has no releases: every source build reports itself as a dev build
  enable-dev-builds: true
  async-workers: 2
  query-plugins: false

auto-report:
  enabled: false

anonymous-statistics:
  enabled: false

auto-updater:
  enabled: false

ticks-per:
  autosave: 72000
